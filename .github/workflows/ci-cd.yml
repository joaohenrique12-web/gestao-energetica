name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: mvn -B test

      - name: Gerar pacote
        run: mvn -B package -DskipTests

      - name: Construir imagem Docker
        run: docker build -t gestao-energetica:${{ github.sha }} .

  deploy-staging:
    name: Deploy staging
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Simular deploy em staging
        run: echo "Deploy em staging aprovado para ${{ github.sha }}"

  deploy-production:
    name: Deploy producao
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Simular deploy em producao
        run: echo "Deploy em producao aprovado para ${{ github.sha }}"
